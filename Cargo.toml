[package]
name = "awgram"
version = "0.27.1"
edition = "2021"
# libsqlite3-sys (rusqlite bundled) использует cfg_select! из Rust 1.95,
# но сам MSRV не объявляет — без этой строки старый тулчейн падает с E0658.
rust-version = "1.95"
description = "Telegram bot for managing AmneziaWG VPN clients"
license = "MIT"
repository = "https://github.com/stevefoxru/awgram"

[dependencies]
teloxide = { version = "0.17", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
chacha20poly1305 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "cookies"] }

[dev-dependencies]
tempfile = "3"
serial_test = "4"

[profile.release]
# Символы срезает rustc при линковке — работает и при кросс-сборке,
# где бинарный strip чужой архитектуры недоступен.
strip = "symbols"
