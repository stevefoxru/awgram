name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        shell: bash
        run: |
          status=0
          output="$(cargo clippy --all-targets -- -D warnings 2>&1)" || status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then
            output="${output//'%'/'%25'}"
            output="${output//$'\r'/'%0D'}"
            output="${output//$'\n'/'%0A'}"
            echo "::error title=Clippy failed::$output"
            exit "$status"
          fi
      - name: test
        run: cargo test
      - name: shellcheck installer
        run: |
          shellcheck install.sh scripts/test-install.sh scripts/test-install-inner.sh
          bash -n install.sh
