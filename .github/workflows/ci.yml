name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        shell: bash
        run: |
          status=0
          output="$(cargo clippy --all-targets -- -D warnings 2>&1)" || status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then
            # Аннотация GitHub обрезается до 4096 символов; короткий хвост
            # содержит panic, failures и итог cargo test целиком.
            output="$(printf '%s\n' "$output" | tail -n 30)"
            output="${output//'%'/'%25'}"
            output="${output//$'\r'/'%0D'}"
            output="${output//$'\n'/'%0A'}"
            echo "::error title=Clippy failed::$output"
            exit "$status"
          fi
      - name: test
        shell: bash
        run: |
          status=0
          output="$(cargo test -- --test-threads=1 --format terse 2>&1)" || status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then
            output="$(printf '%s\n' "$output" | tail -n 120)"
            output="${output//'%'/'%25'}"
            output="${output//$'\r'/'%0D'}"
            output="${output//$'\n'/'%0A'}"
            echo "::error title=Tests failed::$output"
            exit "$status"
          fi
      - name: shellcheck installer
        run: |
          shellcheck install.sh node-bootstrap.sh transfer.sh scripts/test-install.sh scripts/test-install-inner.sh
          bash -n install.sh node-bootstrap.sh transfer.sh
          clientctl_end="$(grep -n '^AWGRAM_CLIENTCTL$' install.sh | cut -d: -f1)"
          updatectl_start="$(grep -n '^install_updatectl()' install.sh | cut -d: -f1)"
          test -n "$clientctl_end" && test -n "$updatectl_start"
          test "$updatectl_start" -gt "$clientctl_end"
